name: build-kext

# Compila RTL8852BT.kext en un runner de macOS de GitHub, que trae Xcode.
# Esto sustituye a tener un Mac o una VM: es el bucle de compilacion del proyecto.
#
# Disparadores: cada push, cada pull request y a mano desde la pestana Actions.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verificaciones que no necesitan compilador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar el firmware (tools/parse_fw.py)
        run: python3 tools/parse_fw.py

      - name: Descargar el driver Linux de referencia
        run: bash tools/fetch_reference.sh

      - name: Verificar el mapa de registros contra el driver Linux
        run: python3 tools/verify_regs.py

      - name: Verificar que el bundle del kext esta bien formado
        run: python3 tools/verify_bundle.py

  build:
    name: Compilar el kext en macOS
    runs-on: macos-latest
    permissions:
      contents: write      # necesario para publicar la Release con el kext
    steps:
      - uses: actions/checkout@v4

      - name: Entorno
        run: |
          sw_vers
          xcodebuild -version
          echo "SDK: $(xcrun --sdk macosx --show-sdk-path)"
          echo "SDK version: $(xcrun --sdk macosx --show-sdk-version)"
          echo "Arquitectura del runner: $(uname -m)"

      - name: Comprobar que Kernel.framework existe en el SDK
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          KH="$SDK/System/Library/Frameworks/Kernel.framework/Headers"
          test -d "$KH" || { echo "FALTA Kernel.framework en el SDK"; exit 1; }
          echo "OK: $KH"
          echo "--- bibliotecas de kext en el SDK ---"
          ls "$SDK/usr/lib" | grep -iE 'kmod|cc_kext' || echo "(ninguna)"

      - name: Compilar
        run: |
          cd kext
          set -o pipefail
          make 2>&1 | tee ../build.log

      - name: Diagnostico si la compilacion fallo
        if: failure()
        run: |
          echo "===== build.log ====="
          cat build.log || true
          echo "===== prueba minima de kext ====="
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          printf '%s\n' \
            '#include <IOKit/IOService.h>' \
            '#include <IOKit/IOLib.h>' \
            'class Probe : public IOService { OSDeclareDefaultStructors(Probe) };' \
            'OSDefineMetaClassAndStructors(Probe, IOService)' > /tmp/probe.cpp
          if xcrun clang++ -arch x86_64 -mkernel -fno-builtin -fno-rtti -fno-exceptions \
               -fno-common -fapple-kext -std=gnu++17 -isysroot "$SDK" \
               -isystem "$SDK/System/Library/Frameworks/Kernel.framework/Headers" \
               -c /tmp/probe.cpp -o /tmp/probe.o; then
            echo "La prueba minima COMPILA: el fallo esta en NUESTRO codigo."
          else
            echo "La prueba minima NO compila: el problema son los flags o el SDK."
          fi

      - name: Revisar el kext construido
        run: |
          KEXT=kext/build/RTL8852BT.kext
          ls -lR "$KEXT"
          echo "--- arquitectura ---"
          file "$KEXT/Contents/MacOS/RTL8852BT"
          echo "--- simbolos sin resolver ---"
          # Un kext NUNCA enlaza IOKit estaticamente: el kernel resuelve estos
          # simbolos al cargar, segun OSBundleLibraries del Info.plist. Lo unico
          # preocupante seria un simbolo que no venga del kernel.
          nm -u "$KEXT/Contents/MacOS/RTL8852BT" > /tmp/undef.txt
          echo "total sin resolver: $(wc -l < /tmp/undef.txt)"
          echo "--- ajenos al kernel (cualquier linea aqui es un fallo real) ---"
          grep -vE '^_(IO|OS|kern|panic|mach|copy|bcopy|bzero|mem(cpy|set|move|cmp)|str|sn?printf|vsnprintf|kprintf|current_task|lck_|thread_|clock_|kalloc|kfree)|^__Z.*(IO|OS)[A-Z]|^_g?IO|^___stack_chk' /tmp/undef.txt > /tmp/foreign.txt || true
          cat /tmp/foreign.txt
          if [ -s /tmp/foreign.txt ]; then
            echo "FALLO: hay simbolos que el kernel no exporta; kextload rechazaria el kext."
            exit 1
          fi
          echo "OK: todos los simbolos sin resolver los aporta el kernel."

      - name: Empaquetar
        run: |
          cd kext/build
          tar czf "$GITHUB_WORKSPACE/RTL8852BT.kext.tar.gz" RTL8852BT.kext
          cd "$GITHUB_WORKSPACE"
          ls -lh RTL8852BT.kext.tar.gz
          shasum -a 256 RTL8852BT.kext.tar.gz

      # Entrega por Release, no por artefacto: los artefactos consumen la cuota
      # de almacenamiento de Actions de la cuenta, que ya estaba llena.
      # La etiqueta es fija y se sobreescribe en cada compilacion de main.
      - name: Publicar en la Release 'ultimo-build'
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          FECHA="$(date -u '+%Y-%m-%d %H:%M UTC')"
          cat > /tmp/notes.md <<NOTES
          Compilado automaticamente desde \`$SHORT\` el $FECHA.

          **Esto compila y enlaza, pero NUNCA se ha probado en el hardware.**

          Instalacion:

          \`\`\`sh
          tar xzf RTL8852BT.kext.tar.gz
          python tools/install_to_opencore.py <ruta-al-USB>/EFI --kext RTL8852BT.kext
          \`\`\`

          Despues, arranca el HP desde el USB y mira el log:

          \`\`\`sh
          log show --last 10m --predicate 'eventMessage CONTAINS "RTL8852BT"' --style compact
          \`\`\`
          NOTES
          gh release delete ultimo-build --yes --cleanup-tag 2>/dev/null || true
          gh release create ultimo-build RTL8852BT.kext.tar.gz \
            --title "Ultimo kext compilado ($SHORT)" \
            --notes-file /tmp/notes.md
          echo "Release publicada:"
          gh release view ultimo-build --json url,assets -q '.url, (.assets[]|.name + " " + (.size|tostring) + " bytes")'

      # Se intenta igualmente, pero sin bloquear: si la cuota esta llena, se ignora.
      - name: Artefacto (opcional, puede fallar por cuota)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: RTL8852BT.kext
          path: kext/build/RTL8852BT.kext
          retention-days: 7
          if-no-files-found: warn

      - name: Log de compilacion (opcional)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore

  # Validacion real en macOS x86_64.
  #
  # Correccion importante: GitHub SI ofrece runners Intel como etiquetas
  # estandar, 'macos-15-intel' y 'macos-26-intel'. En un intento anterior solo
  # probe macos-14/15/latest, que son Apple Silicon, y concluí de mas que no
  # habia Intel. Lo habia.
  #
  # Con un runner x86_64, kmutil puede resolver de verdad los simbolos del kext
  # contra el kernel y decir si macOS lo aceptaria. Es exactamente lo que se
  # buscaba con una maquina virtual, pero automatico y en cada push.
  validar-en-macos-intel:
    name: Validar el kext en macOS Intel
    needs: build
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirmar que es Intel de verdad
        run: |
          echo "etiqueta: ${{ matrix.runner }}"
          echo "uname -m: $(uname -m)"
          sw_vers
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "NO es x86_64; esta validacion no sirve en este runner."
            exit 1
          fi
          echo "OK: runner Intel, la validacion tiene sentido."

      - name: Compilar
        run: cd kext && make

      - name: kmutil libraries - el sustituto moderno de kextlibs
        run: |
          KEXT=kext/build/RTL8852BT.kext
          echo "kextlibs busca en /System/Library/Extensions, que en macOS"
          echo "moderno esta practicamente vacio: los KPI viven ahora en"
          echo "/System/Library/KernelCollections/*.kc. Por eso decia que no"
          echo "encontraba NINGUNO de los 296 simbolos."
          ls /System/Library/Extensions | wc -l
          ls /System/Library/KernelCollections/ 2>/dev/null || true
          echo
          echo "=== ayuda ==="
          kmutil libraries --help 2>&1 | head -25 || true
          echo
          echo "=== resolucion real de simbolos ==="
          kmutil libraries --xml -p "$KEXT" 2>&1 | tee /tmp/libs.txt | head -40 || true
          echo "===== veredicto ====="
          if grep -qiE "not found|unresolved|missing" /tmp/libs.txt; then
            echo "Quedan simbolos sin resolver. Revisar OSBundleLibraries."
          elif grep -q "com.apple.kpi" /tmp/libs.txt; then
            echo "RESUELTO: kmutil encuentra las librerias que necesita el kext."
          else
            echo "Salida inesperada, revisar arriba."
          fi

      - name: kmutil create - enlazar el kext en una coleccion (best effort)
        continue-on-error: true
        run: |
          KEXT="$PWD/kext/build/RTL8852BT.kext"
          REPO="$PWD/kext/build"
          KC=/System/Library/KernelCollections
          ID=com.poveda.driver.RTL8852BT
          echo "La validacion principal ya la dio 'kmutil libraries' (paso anterior)."
          echo "Esto es un extra: construir una coleccion auxiliar real, que obliga"
          echo "a enlazar el kext contra el kernel."
          echo
          echo "=== intento con -r (repositorio) + -b (identificador) ==="
          sudo kmutil create -z -a x86_64 -V release -n aux             -r "$REPO" -b "$ID"             -B "$KC/BootKernelExtensions.kc"             -S "$KC/SystemKernelExtensions.kc"             -A /tmp/aux.kc             --allow-missing-kdk 2>&1 | tee /tmp/create.txt || true
          echo
          echo "===== veredicto ====="
          OUT=$(ls /tmp/aux.kc* 2>/dev/null | head -1)
          if [ -n "$OUT" ]; then
            echo "ENLAZADO CORRECTAMENTE. macOS puede cargar este kext."
            ls -lh "$OUT"
          elif grep -qiE "Symbol.*not found|Undefined symbol|link failure|unresolved" /tmp/create.txt; then
            echo "FALLO DE ENLACE REAL: faltan simbolos. Esto si es un problema."
            exit 1
          else
            echo "No concluyente por limitaciones del entorno de CI, no del kext."
            echo "kmutil create necesita un KDK de Apple que requiere cuenta de"
            echo "desarrollador. La validacion que SI vale es la del paso anterior."
          fi
